      #bootstrap::before,#bootstrap::after{content:"";position:absolute;inset:-25%;pointer-events:none}
      #bootstrap::before{background:conic-gradient(from 0deg,transparent 0 38%,rgba(239,157,70,.09) 41%,transparent 45% 72%,rgba(176,56,76,.08) 76%,transparent 80%);animation:boot-orbit 16s linear infinite}
      #bootstrap::after{background-image:radial-gradient(circle,#ffd58a 0 1px,transparent 1.5px);background-size:63px 71px;opacity:.16;animation:boot-drift 9s linear infinite}
      .boot-scene{position:relative;width:min(560px,82vw);display:grid;justify-items:center;text-align:center}
      .boot-sigil{position:relative;width:118px;height:118px;margin-bottom:18px;display:grid;place-items:center;border:1px solid rgba(255,214,142,.24);border-radius:50%;box-shadow:0 0 90px rgba(218,106,53,.2),inset 0 0 40px rgba(255,210,126,.08)}
      .boot-sigil::before{content:"";width:72px;height:72px;border-radius:44% 56% 47% 53%;background:radial-gradient(circle at 35% 28%,#ffcf77,#c66d32 50%,#6e2b25 72%);box-shadow:inset -8px -9px 0 rgba(68,20,20,.3),0 8px 22px rgba(0,0,0,.34);animation:boot-breathe 1.8s ease-in-out infinite}
      .boot-sigil::after{content:"";position:absolute;width:2px;height:78px;background:linear-gradient(transparent,#fff0c1 24%,#df6c45 60%,transparent);transform:rotate(24deg);filter:drop-shadow(0 0 8px #ff9c57);animation:boot-crack 1.8s ease-in-out infinite}
      .boot-title{display:block;font:900 clamp(34px,7vw,64px)/.82 ui-rounded,system-ui,sans-serif;letter-spacing:-.045em;text-shadow:0 4px #54251d,0 14px 34px rgba(0,0,0,.45)}
      .boot-title em{display:block;color:#e9a554;font-style:normal}
      .boot-promise{margin:14px 0 20px;color:#bda68a;font-size:9px;letter-spacing:.2em}
      .boot-meter{width:min(360px,72vw);display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
      .boot-meter i{height:4px;overflow:hidden;background:#2d1b19;box-shadow:inset 0 1px 2px #050507}
      .boot-meter i::after{content:"";display:block;width:var(--boot-progress,8%);height:100%;background:linear-gradient(90deg,#9c3c43,#f0aa54,#fff0b8);box-shadow:0 0 18px #e39344;transition:width .18s ease}
      #bootstrap-label{margin-top:10px;color:#d4b78e;font-size:8px;letter-spacing:.18em}
      #bootstrap-progress{color:#f0bd6d;font-size:9px}
      #bootstrap:not([data-bootstrap-error]) .boot-sigil,
      #bootstrap:not([data-bootstrap-error]) .boot-title,
      #bootstrap:not([data-bootstrap-error]) .boot-promise{display:none}
      #bootstrap button{margin-top:18px;padding:12px 18px;border:1px solid #d69245;background:#2c1814;color:#fff0cf;font:inherit;cursor:pointer;pointer-events:auto}
      @keyframes boot-orbit{to{transform:rotate(1turn)}}
      @keyframes boot-drift{to{transform:translate3d(63px,71px,0)}}
      @keyframes boot-breathe{50%{transform:translateY(-3px) scale(1.04,.97);filter:brightness(1.12)}}
      @keyframes boot-crack{0%,100%{opacity:.46;transform:rotate(24deg) scaleY(.78)}48%{opacity:1;transform:rotate(24deg) scaleY(1.16)}}
      @media(prefers-reduced-motion:reduce){#bootstrap::before,#bootstrap::after,.boot-sigil::before,.boot-sigil::after{animation:none}}
